name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Run go vet
        working-directory: gateway
        run: go vet ./...

      - name: Run tests
        working-directory: gateway
        run: go test -race -timeout 60s ./...

      - name: Check go mod tidy
        working-directory: gateway
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/go-kiro-gateway-models

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: plugins/go-kiro-gateway-models/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Check plugin
        run: npm run check
